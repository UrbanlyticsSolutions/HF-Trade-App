<!DOCTYPE html>
<html>
<head>
  <title>Trading Dashboard</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
    h1 { color: #38bdf8; margin-bottom: 20px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: #1e293b; padding: 20px; border-radius: 10px; border-left: 4px solid #38bdf8; }
    .stat-card h3 { color: #94a3b8; font-size: 14px; margin-bottom: 5px; }
    .stat-card .value { font-size: 28px; font-weight: bold; }
    .profit { color: #22c55e; }
    .loss { color: #ef4444; }
    .chart-container { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 30px; }
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 10px; overflow: hidden; margin-top: 20px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #334155; color: #38bdf8; font-weight: 600; }
    tr:hover { background: #334155; }
    .refresh-btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .refresh-btn:hover { background: #0ea5e9; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .loading { text-align: center; padding: 40px; color: #94a3b8; }
    /* Login screen */
    .login-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .login-box { background: #1e293b; padding: 40px; border-radius: 10px; text-align: center; max-width: 400px; }
    .login-box h2 { color: #38bdf8; margin-bottom: 20px; }
    .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #334155; border-radius: 5px; background: #0f172a; color: #e2e8f0; font-size: 16px; }
    .login-box button { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; }
    .login-box button:hover { background: #0ea5e9; }
    .login-box .error { color: #ef4444; margin-top: 10px; }
    .hidden { display: none !important; }
    .logout-btn { background: #ef4444; margin-left: 10px; }
    .logout-btn:hover { background: #dc2626; }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h2>🔐 Trading Dashboard</h2>
      <p style="color: #94a3b8; margin-bottom: 20px;">Enter your API key to access</p>
      <input type="password" id="apiKeyInput" placeholder="Enter API Key" onkeypress="if(event.key==='Enter')login()">
      <button onclick="login()">Access Dashboard</button>
      <div class="error hidden" id="loginError">Invalid API key</div>
    </div>
  </div>

  <!-- Dashboard (hidden until login) -->
  <div id="dashboard" class="hidden">
    <div class="header">
      <h1>📈 Trading Dashboard</h1>
      <div>
        <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
        <button class="refresh-btn logout-btn" onclick="logout()">🚪 Logout</button>
      </div>
    </div>
    
    <div class="stats" id="stats">
      <div class="loading">Loading...</div>
    </div>

    <div class="chart-container">
      <h2 style="margin-bottom: 15px; color: #38bdf8;">Equity Curve</h2>
      <div id="equityChart" style="height: 300px;"></div>
    </div>

    <h2 style="color: #38bdf8;">Trade History</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Symbol</th>
          <th>Qty</th>
          <th>Entry</th>
          <th>Exit</th>
          <th>P&L</th>
          <th>Entry Time</th>
          <th>Exit Time</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tradesTable">
        <tr><td colspan="9" class="loading">Loading trades...</td></tr>
      </tbody>
    </table>

    <p id="lastUpdate" style="margin-top: 30px; color: #64748b; text-align: center;"></p>
  </div>

  <script>
    const API_BASE = 'https://ncnbasvptocuwgxvyjmw.supabase.co/functions/v1/trading-api';
    let API_KEY = sessionStorage.getItem('tradingApiKey') || '';

    // Check if already logged in
    if (API_KEY) {
      verifyAndLoad();
    }

    async function login() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (!key) return;
      
      API_KEY = key;
      await verifyAndLoad();
    }

    async function verifyAndLoad() {
      try {
        const res = await fetch(`${API_BASE}/state`, {
          headers: { 'x-api-key': API_KEY }
        });
        
        if (res.status === 401) {
          document.getElementById('loginError').classList.remove('hidden');
          sessionStorage.removeItem('tradingApiKey');
          return;
        }
        
        // Success - save key and show dashboard
        sessionStorage.setItem('tradingApiKey', API_KEY);
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        loadData();
        
      } catch (err) {
        document.getElementById('loginError').textContent = 'Connection error';
        document.getElementById('loginError').classList.remove('hidden');
      }
    }

    function logout() {
      sessionStorage.removeItem('tradingApiKey');
      API_KEY = '';
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('apiKeyInput').value = '';
      document.getElementById('loginError').classList.add('hidden');
    }

    async function loadData() {
      try {
        // Fetch all data in parallel WITH API KEY
        const headers = { 'x-api-key': API_KEY };
        const [tradesRes, stateRes, equityRes] = await Promise.all([
          fetch(`${API_BASE}/trades`, { headers }),
          fetch(`${API_BASE}/state`, { headers }),
          fetch(`${API_BASE}/equity`, { headers })
        ]);

        if (tradesRes.status === 401) {
          logout();
          return;
        }

        const trades = await tradesRes.json();
        const stateArr = await stateRes.json();
        const equity = await equityRes.json();

        // Parse state
        const state = {};
        for (const s of stateArr) {
          state[s.key] = s.value;
        }

        const initialCapital = state.initial_capital || 10000;
        const currentCapital = state.current_capital || initialCapital;
        const pnl = currentCapital - initialCapital;
        const pnlPct = ((pnl / initialCapital) * 100).toFixed(2);
        const winTrades = trades.filter(t => t.pnl > 0).length;
        const lossTrades = trades.filter(t => t.pnl < 0).length;
        const winRate = trades.length > 0 ? ((winTrades / trades.length) * 100).toFixed(1) : 0;

        // Update stats
        document.getElementById('stats').innerHTML = `
          <div class="stat-card">
            <h3>Initial Capital</h3>
            <div class="value">$${initialCapital.toLocaleString()}</div>
          </div>
          <div class="stat-card">
            <h3>Current Capital</h3>
            <div class="value">$${currentCapital.toLocaleString()}</div>
          </div>
          <div class="stat-card">
            <h3>Total P&L</h3>
            <div class="value ${pnl >= 0 ? 'profit' : 'loss'}">$${pnl.toLocaleString()} (${pnlPct}%)</div>
          </div>
          <div class="stat-card">
            <h3>Win Rate</h3>
            <div class="value">${winRate}% (${winTrades}W / ${lossTrades}L)</div>
          </div>
          <div class="stat-card">
            <h3>Total Trades</h3>
            <div class="value">${trades.length}</div>
          </div>
        `;

        // Update trades table
        if (trades.length > 0) {
          document.getElementById('tradesTable').innerHTML = trades.map(t => {
            const pnlClass = t.pnl >= 0 ? 'profit' : 'loss';
            return `<tr>
              <td>${t.trade_id}</td>
              <td>${t.symbol}</td>
              <td>${t.quantity}</td>
              <td>$${t.entry_price?.toFixed(2) || '-'}</td>
              <td>$${t.exit_price?.toFixed(2) || '-'}</td>
              <td class="${pnlClass}">$${t.pnl?.toFixed(2) || '-'}</td>
              <td>${new Date(t.entry_time).toLocaleString()}</td>
              <td>${t.exit_time ? new Date(t.exit_time).toLocaleString() : '-'}</td>
              <td>${t.status}</td>
            </tr>`;
          }).join('');
        } else {
          document.getElementById('tradesTable').innerHTML = '<tr><td colspan="9" style="text-align:center;">No trades yet</td></tr>';
        }

        // Build equity curve from trades (cumulative P&L)
        let cumPnl = initialCapital;
        const equityData = [{x: 'Start', y: initialCapital}];
        
        // Sort trades by entry_time ascending
        const sortedTrades = [...trades].sort((a, b) => new Date(a.entry_time) - new Date(b.entry_time));
        
        for (const t of sortedTrades) {
          if (t.pnl) {
            cumPnl += t.pnl;
            equityData.push({
              x: new Date(t.exit_time || t.entry_time).toLocaleString('en-US', {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'}),
              y: cumPnl
            });
          }
        }

        // Plot equity curve with Plotly
        const trace = {
          x: equityData.map(d => d.x),
          y: equityData.map(d => d.y),
          type: 'scatter',
          mode: 'lines+markers',
          line: { color: '#38bdf8', width: 2 },
          marker: { size: 8, color: '#38bdf8' },
          fill: 'tozeroy',
          fillcolor: 'rgba(56, 189, 248, 0.1)'
        };

        const layout = {
          paper_bgcolor: '#1e293b',
          plot_bgcolor: '#1e293b',
          font: { color: '#e2e8f0' },
          margin: { t: 20, r: 20, b: 50, l: 60 },
          xaxis: {
            gridcolor: '#334155',
            tickangle: -45
          },
          yaxis: {
            gridcolor: '#334155',
            tickprefix: '$',
            range: equityData.length > 1 ? [
              Math.min(...equityData.map(d => d.y)) * 0.99,
              Math.max(...equityData.map(d => d.y)) * 1.01
            ] : undefined
          }
        };

        Plotly.newPlot('equityChart', [trace], layout, {responsive: true, displayModeBar: false});

        document.getElementById('lastUpdate').textContent = `Last updated: ${new Date().toLocaleString()} | Data from Supabase`;

      } catch (err) {
        console.error('Error loading data:', err);
        document.getElementById('stats').innerHTML = `<div class="loading" style="color: #ef4444;">Error loading data: ${err.message}</div>`;
      }
    }

    // Load data on page load
    loadData();

    // Auto-refresh every 30 seconds
    setInterval(loadData, 30000);
  </script>
</body>
</html>
