# Deploy to GCloud VM on push to main
# Requires GitHub Secrets:
#   GCP_SA_KEY        — base64-encoded service account JSON key
#   GCP_PROJECT_ID    — stock-479103
#   GCP_VM_ZONE       — us-east1-b
#   VM_ENV_FILE       — contents of deploy/.env (IB creds, passwords, etc.)
#   GMAIL_APP_PASSWORD — Gmail App Password for deployment notifications
name: Deploy to GCloud

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

concurrency:
  group: deploy-production
  cancel-in-progress: false  # Never cancel a running deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Create deployment tarball
        run: |
          tar czf /tmp/trading-app.tar.gz \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='output' \
            --exclude='.git' \
            --exclude='*.db' \
            --exclude='*.db-journal' \
            --exclude='.github' \
            --exclude='node_modules' \
            .

      - name: Upload to VM
        run: |
          gcloud compute scp /tmp/trading-app.tar.gz \
            ib-trading:/tmp/trading-app.tar.gz \
            --zone=${{ secrets.GCP_VM_ZONE }}

      - name: Write .env file on VM
        run: |
          gcloud compute ssh ib-trading --zone=${{ secrets.GCP_VM_ZONE }} --command="
            sudo tee /home/Kaiqi/trading-app/.env > /dev/null << 'ENVEOF'
          ${{ secrets.VM_ENV_FILE }}
          ENVEOF
          "

      - name: Deploy on VM
        run: |
          gcloud compute ssh ib-trading --zone=${{ secrets.GCP_VM_ZONE }} --command="
            set -e
            sudo bash -c '
              # Extract new code
              tar xzf /tmp/trading-app.tar.gz -C /home/Kaiqi/trading-app
              rm -f /tmp/trading-app.tar.gz

              # Rebuild and restart only the app container (keep IB Gateway running)
              cd /home/Kaiqi/trading-app/deploy
              docker compose build app
              docker compose up -d app

              echo === Deployment complete ===
              docker compose ps
              echo
              echo === Recent app logs ===
              docker compose logs --tail=20 app
            '
          "

      - name: Print deployment info
        if: always()
        run: |
          EXTERNAL_IP=$(gcloud compute instances describe ib-trading \
            --zone=${{ secrets.GCP_VM_ZONE }} \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **VM**: ib-trading (${{ secrets.GCP_VM_ZONE }})" >> $GITHUB_STEP_SUMMARY
          echo "- **IP**: ${EXTERNAL_IP}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dashboard**: http://${EXTERNAL_IP}:8040" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Collect system health
        id: health
        if: always()
        run: |
          # Get VM external IP
          EXTERNAL_IP=$(gcloud compute instances describe ib-trading \
            --zone=${{ secrets.GCP_VM_ZONE }} \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "vm_ip=${EXTERNAL_IP}" >> $GITHUB_OUTPUT

          # Collect system status + uptime stats from VM
          gcloud compute ssh ib-trading --zone=${{ secrets.GCP_VM_ZONE }} --command="
            echo '=== VM ==='
            uptime
            free -h | head -2
            df -h / | tail -1

            echo '=== CONTAINERS ==='
            cd /home/Kaiqi/trading-app/deploy
            sudo docker compose ps --format 'table {{.Name}}\t{{.Status}}\t{{.Ports}}' 2>/dev/null || sudo docker compose ps

            echo '=== ENGINE STATUS ==='
            # Check engine log freshness
            TODAY=\$(date +%Y%m%d)
            LOGFILE=/home/Kaiqi/trading-app/logs/live_0dte_\${TODAY}.log
            if [ -f \"\$LOGFILE\" ]; then
              LAST_LINE=\$(tail -1 \"\$LOGFILE\")
              echo \"Last log: \$LAST_LINE\"
              ERRORS=\$(grep -c 'ERROR\|CRITICAL' \"\$LOGFILE\" 2>/dev/null || echo 0)
              echo \"Errors today: \$ERRORS\"
            else
              echo 'No engine log today'
            fi

            echo '=== TRADING STATE ==='
            cat /home/Kaiqi/trading-app/trading_state.json 2>/dev/null | python3 -c '
import sys, json
try:
    s = json.load(sys.stdin)
    print(f\"Capital: \${s.get(\"current_capital\",0):,.2f}\")
    print(f\"Total P&L: \${s.get(\"total_pnl\",0):,.2f}\")
    print(f\"Trades: {s.get(\"total_trades\",0)} (W:{s.get(\"total_wins\",0)} L:{s.get(\"total_losses\",0)})\")
    t = s.get(\"total_trades\",0)
    wr = (s.get(\"total_wins\",0)/t*100) if t > 0 else 0
    print(f\"Win Rate: {wr:.1f}%\")
    print(f\"Max Drawdown: \${s.get(\"max_drawdown\",0):,.2f}\")
    print(f\"Engine: {s.get(\"engine_status\",\"unknown\")}\")
    print(f\"Updated: {s.get(\"last_updated\",\"?\")}\")
except: print(\"Could not parse state\")
' 2>/dev/null || echo 'No trading state'

            echo '=== UPTIME: TODAY ==='
            DB=/home/Kaiqi/trading-app/data/live_0dte_trades.db
            if [ -f \"\$DB\" ]; then
              python3 -c \"
import sqlite3, json
from datetime import date, timedelta
conn = sqlite3.connect('\$DB')
c = conn.cursor()
today = date.today().strftime('%Y-%m-%d')

# Today
c.execute('''SELECT COUNT(*),
  SUM(CASE WHEN pnl > 0 THEN 1 ELSE 0 END),
  SUM(CASE WHEN pnl <= 0 THEN 1 ELSE 0 END),
  COALESCE(SUM(pnl), 0),
  COALESCE(SUM(commission), 0)
  FROM trades WHERE entry_time LIKE ? AND status='closed' ''', (today+'%',))
r = c.fetchone()
trades, wins, losses = r[0] or 0, r[1] or 0, r[2] or 0
pnl, comm = r[3] or 0, r[4] or 0
wr = (wins/trades*100) if trades > 0 else 0
print(f'Trades: {trades} | Wins: {wins} | Losses: {losses} | Win Rate: {wr:.0f}%')
print(f'Gross P&L: \${pnl:,.2f} | Commissions: \${comm:,.2f} | Net: \${pnl-comm:,.2f}')

# Open positions
c.execute('SELECT symbol, quantity, entry_price FROM trades WHERE status=\"open\"')
opens = c.fetchall()
if opens:
  print(f'Open positions: {len(opens)}')
  for o in opens:
    print(f'  {o[0]} x{o[1]} @ \${o[2]:.2f}')
else:
  print('No open positions')

print()
print('=== UPTIME: PAST 7 DAYS ===')
for i in range(7):
  d = (date.today() - timedelta(days=i)).strftime('%Y-%m-%d')
  c.execute('''SELECT COUNT(*),
    SUM(CASE WHEN pnl > 0 THEN 1 ELSE 0 END),
    COALESCE(SUM(pnl), 0),
    COALESCE(SUM(commission), 0)
    FROM trades WHERE entry_time LIKE ? AND status='closed' ''', (d+'%',))
  r = c.fetchone()
  t, w, p, cm = r[0] or 0, r[1] or 0, r[2] or 0, r[3] or 0
  if t > 0:
    wr = w/t*100
    print(f'{d}: {t} trades, {wr:.0f}% win, P&L \${p-cm:,.2f}')
  else:
    # Check if engine ran (log exists)
    import os
    logf = f'/home/Kaiqi/trading-app/logs/live_0dte_{d.replace(\"-\",\"\")}.log'
    if os.path.exists(logf):
      print(f'{d}: Engine ran, 0 trades')
    else:
      day_name = (date.today() - timedelta(days=i)).strftime('%a')
      print(f'{d}: No activity ({day_name})')

# 7-day totals
week_ago = (date.today() - timedelta(days=6)).strftime('%Y-%m-%d')
c.execute('''SELECT COUNT(*),
  SUM(CASE WHEN pnl > 0 THEN 1 ELSE 0 END),
  COALESCE(SUM(pnl), 0),
  COALESCE(SUM(commission), 0)
  FROM trades WHERE entry_time >= ? AND status='closed' ''', (week_ago,))
r = c.fetchone()
t7, w7, p7, c7 = r[0] or 0, r[1] or 0, r[2] or 0, r[3] or 0
wr7 = (w7/t7*100) if t7 > 0 else 0
print(f'--- 7-Day Total: {t7} trades, {wr7:.0f}% win, Net P&L \${p7-c7:,.2f} ---')
conn.close()
\" 2>/dev/null
            else
              echo 'No trade database found'
            fi

            echo '=== APP LOGS (last 10) ==='
            cd /home/Kaiqi/trading-app/deploy
            sudo docker compose logs --tail=10 app 2>&1
          " 2>&1 > /tmp/health.txt || echo "Failed to collect health data" > /tmp/health.txt

      - name: Collect changelog
        id: changelog
        if: always()
        run: |
          # Get commits in this push
          CHANGES=$(git log --pretty=format:"• %s (%an, %ar)" -10 2>/dev/null || echo "No changelog available")
          echo "$CHANGES" > /tmp/changelog.txt

      - name: Build email body
        if: always()
        run: |
          HEALTH=$(cat /tmp/health.txt 2>/dev/null || echo "Health data not available")
          CHANGELOG=$(cat /tmp/changelog.txt 2>/dev/null || echo "No changelog")
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            COLOR="#2ea44f"; LABEL="Successful"
          else
            COLOR="#d73a49"; LABEL="Failed"
          fi

          cat > /tmp/email.html << EMAILEOF
          <h2 style="color: ${COLOR}">Deployment ${LABEL}</h2>
          <h3>Deployment Info</h3>
          <table style="border-collapse:collapse; font-family:monospace;">
            <tr><td style="padding:4px 12px;"><b>VM</b></td><td>ib-trading (${{ secrets.GCP_VM_ZONE }})</td></tr>
            <tr><td style="padding:4px 12px;"><b>IP</b></td><td>${{ steps.health.outputs.vm_ip }}</td></tr>
            <tr><td style="padding:4px 12px;"><b>Dashboard</b></td><td><a href="http://${{ steps.health.outputs.vm_ip }}:8040">http://${{ steps.health.outputs.vm_ip }}:8040</a></td></tr>
            <tr><td style="padding:4px 12px;"><b>Commit</b></td><td><a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a></td></tr>
            <tr><td style="padding:4px 12px;"><b>Branch</b></td><td>${{ github.ref_name }}</td></tr>
            <tr><td style="padding:4px 12px;"><b>Triggered by</b></td><td>${{ github.actor }}</td></tr>
            <tr><td style="padding:4px 12px;"><b>Time (UTC)</b></td><td>${{ github.event.head_commit.timestamp }}</td></tr>
          </table>
          <h3>Changes</h3>
          <pre style="background:#f6f8fa; padding:12px; border-radius:6px;">${CHANGELOG}</pre>
          <h3>System Health</h3>
          <pre style="background:#f6f8fa; padding:12px; border-radius:6px; font-size:12px;">${HEALTH}</pre>
          <p style="color:#888; font-size:11px;">
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View full run logs</a>
          </p>
          EMAILEOF

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: realericzhu@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[${{ job.status == 'success' && 'DEPLOYED' || 'FAILED' }}] Trading App - ${{ github.event.head_commit.message }}"
          to: realericzhu@gmail.com
          from: "Trading Deploy Bot <realericzhu@gmail.com>"
          html_body: file:///tmp/email.html
