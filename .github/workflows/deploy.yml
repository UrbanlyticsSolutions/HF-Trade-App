# Deploy to GCloud VM on push to main
# Requires GitHub Secrets:
#   GCP_SA_KEY        — base64-encoded service account JSON key
#   GCP_PROJECT_ID    — stock-479103
#   GCP_VM_ZONE       — us-east1-b
#   VM_ENV_FILE       — contents of deploy/.env (IB creds, passwords, etc.)
#   GMAIL_APP_PASSWORD — Gmail App Password for deployment notifications
name: Deploy to GCloud

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

concurrency:
  group: deploy-production
  cancel-in-progress: false  # Never cancel a running deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Create deployment tarball
        run: |
          tar czf /tmp/trading-app.tar.gz \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='output' \
            --exclude='.git' \
            --exclude='*.db' \
            --exclude='*.db-journal' \
            --exclude='.github' \
            --exclude='node_modules' \
            .

      - name: Upload to VM
        run: |
          gcloud compute scp /tmp/trading-app.tar.gz \
            ib-trading:/tmp/trading-app.tar.gz \
            --zone=${{ secrets.GCP_VM_ZONE }}

      - name: Write .env file on VM
        run: |
          gcloud compute ssh ib-trading --zone=${{ secrets.GCP_VM_ZONE }} --command="
            sudo tee /home/Kaiqi/trading-app/.env > /dev/null << 'ENVEOF'
          ${{ secrets.VM_ENV_FILE }}
          ENVEOF
          "

      - name: Deploy on VM
        run: |
          gcloud compute ssh ib-trading --zone=${{ secrets.GCP_VM_ZONE }} --command="
            set -e
            sudo bash -c '
              # Extract new code
              tar xzf /tmp/trading-app.tar.gz -C /home/Kaiqi/trading-app
              rm -f /tmp/trading-app.tar.gz

              # Rebuild and restart only the app container (keep IB Gateway running)
              cd /home/Kaiqi/trading-app/deploy
              docker compose build app
              docker compose up -d app

              echo === Deployment complete ===
              docker compose ps
              echo
              echo === Recent app logs ===
              docker compose logs --tail=20 app
            '
          "

      - name: Print deployment info
        if: always()
        run: |
          EXTERNAL_IP=$(gcloud compute instances describe ib-trading \
            --zone=${{ secrets.GCP_VM_ZONE }} \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **VM**: ib-trading (${{ secrets.GCP_VM_ZONE }})" >> $GITHUB_STEP_SUMMARY
          echo "- **IP**: ${EXTERNAL_IP}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dashboard**: http://${EXTERNAL_IP}:8040" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Collect system health
        id: health
        if: always()
        run: |
          # Get VM external IP
          EXTERNAL_IP=$(gcloud compute instances describe ib-trading \
            --zone=${{ secrets.GCP_VM_ZONE }} \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "vm_ip=${EXTERNAL_IP}" >> $GITHUB_OUTPUT

          # Collect system + trading stats from VM
          gcloud compute ssh ib-trading --zone=${{ secrets.GCP_VM_ZONE }} -- bash -s << 'HEALTHEOF' > /tmp/health.txt 2>&1 || echo "Failed to collect health" > /tmp/health.txt
          echo "=== VM ==="
          uptime
          free -h | head -2
          df -h / | tail -1
          echo ""

          echo "=== CONTAINERS ==="
          cd /home/Kaiqi/trading-app/deploy
          sudo docker compose ps 2>/dev/null
          echo ""

          echo "=== TRADING STATS ==="
          cd /home/Kaiqi/trading-app
          sudo python3 scripts/deploy_health.py 2>/dev/null || echo "Stats script failed"
          echo ""

          echo "=== APP LOGS (last 10) ==="
          cd /home/Kaiqi/trading-app/deploy
          sudo docker compose logs --tail=10 app 2>&1
          HEALTHEOF

      - name: Collect changelog
        id: changelog
        if: always()
        run: |
          # Get commits in this push
          CHANGES=$(git log --pretty=format:"• %s (%an, %ar)" -10 2>/dev/null || echo "No changelog available")
          echo "$CHANGES" > /tmp/changelog.txt

      - name: Build email body
        if: always()
        run: |
          python3 << 'PYEOF'
          import html, os

          def read_file(path, fallback="Not available"):
              try:
                  with open(path) as f:
                      return f.read().strip()
              except:
                  return fallback

          health = html.escape(read_file("/tmp/health.txt", "Health data not available"))
          changelog = html.escape(read_file("/tmp/changelog.txt", "No changelog"))

          status = os.environ.get("DEPLOY_STATUS", "unknown")
          color = "#2ea44f" if status == "success" else "#d73a49"
          label = "Successful" if status == "success" else "Failed"

          vm_ip = os.environ.get("VM_IP", "unknown")
          commit = os.environ.get("COMMIT_SHA", "")
          repo = os.environ.get("REPO", "")
          branch = os.environ.get("BRANCH", "")
          actor = os.environ.get("ACTOR", "")
          timestamp = os.environ.get("TIMESTAMP", "")
          run_id = os.environ.get("RUN_ID", "")
          vm_zone = os.environ.get("VM_ZONE", "")
          commit_msg = os.environ.get("COMMIT_MSG", "")

          email_html = f"""<h2 style="color: {color}">Deployment {label}</h2>
          <h3>Deployment Info</h3>
          <table style="border-collapse:collapse; font-family:monospace;">
            <tr><td style="padding:4px 12px;"><b>VM</b></td><td>ib-trading ({vm_zone})</td></tr>
            <tr><td style="padding:4px 12px;"><b>IP</b></td><td>{vm_ip}</td></tr>
            <tr><td style="padding:4px 12px;"><b>Dashboard</b></td><td><a href="http://{vm_ip}:8040">http://{vm_ip}:8040</a></td></tr>
            <tr><td style="padding:4px 12px;"><b>Commit</b></td><td><a href="https://github.com/{repo}/commit/{commit}">{commit[:12]}</a></td></tr>
            <tr><td style="padding:4px 12px;"><b>Branch</b></td><td>{branch}</td></tr>
            <tr><td style="padding:4px 12px;"><b>Triggered by</b></td><td>{actor}</td></tr>
            <tr><td style="padding:4px 12px;"><b>Time (UTC)</b></td><td>{timestamp}</td></tr>
          </table>
          <h3>Commit Message</h3>
          <pre style="background:#f6f8fa; padding:12px; border-radius:6px;">{html.escape(commit_msg)}</pre>
          <h3>Recent Changes</h3>
          <pre style="background:#f6f8fa; padding:12px; border-radius:6px;">{changelog}</pre>
          <h3>System Health &amp; Trading Stats</h3>
          <pre style="background:#f6f8fa; padding:12px; border-radius:6px; font-size:12px;">{health}</pre>
          <p style="color:#888; font-size:11px;">
            <a href="https://github.com/{repo}/actions/runs/{run_id}">View full run logs</a>
          </p>"""

          with open("/tmp/email.html", "w") as f:
              f.write(email_html)
          # Also write to workspace for the send-mail action
          with open("email.html", "w") as f:
              f.write(email_html)
          print("Email body written")
          PYEOF
        env:
          DEPLOY_STATUS: ${{ job.status }}
          VM_IP: ${{ steps.health.outputs.vm_ip }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          RUN_ID: ${{ github.run_id }}
          VM_ZONE: ${{ secrets.GCP_VM_ZONE }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: realericzhu@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[${{ job.status == 'success' && 'DEPLOYED' || 'FAILED' }}] Trading App - ${{ github.event.head_commit.message }}"
          to: realericzhu@gmail.com
          from: "Trading Deploy Bot <realericzhu@gmail.com>"
          html_body: file://email.html
